# ============================================
# NOMBRE DE LA APLICACIÓN
# ============================================
spring.application.name=gestion

# CDC (Change Data Capture) - Deshabilitar por defecto para que la app funcione sin CDC
cdc.enabled=true

# ============================================
# POSTGRESQL - CONEXIÓN A LA BASE DE DATOS
# ============================================
# URL de conexión: jdbc:postgresql://host:puerto/base_de_datos
spring.datasource.url=jdbc:postgresql://localhost:5432/supervisa
spring.datasource.username=postgres
spring.datasource.password=postgres

# ddl-auto: qué hacer con las tablas al iniciar
# "none" = no hacer nada (ya existen)
# "update" = crear/modificar tablas automáticamente
# "create" = borrar y crear tablas (¡CUIDADO!)
spring.jpa.hibernate.ddl-auto=none

# Mostrar SQL en consola (útil para desarrollo)
spring.jpa.show-sql=true

# ============================================
# CDC - DEBEZIUM (Change Data Capture)
# ============================================
# 
# ¿Qué es CDC?
# CDC lee el WAL (Write-Ahead Log) de PostgreSQL.
# El WAL es el log interno que usa PostgreSQL para:
# - Garantizar durabilidad de los datos
# - Replicación entre servidores
# 
# CDC NO consulta las tablas - lee el log directamente.
# Por eso no sobrecarga la base de datos.
# 

# Host de PostgreSQL
debezium.database.hostname=localhost

# Puerto de PostgreSQL
debezium.database.port=5432

# Usuario de PostgreSQL
debezium.database.user=postgres

# Contraseña de PostgreSQL
debezium.database.password=postgres

# Nombre de la base de datos
debezium.database.dbname=supervisa

# Prefijo para los topics de Debezium
# Cuando detecta un cambio, crea un topic con este prefijo
# Ejemplo: "supervisa" → topic = "supervisa.contratistas.ct_t_trazabilidad"
debezium.topic.prefix=supervisa

# Nombre del slot de replicación lógica
# Se crea en PostgreSQL con:
# SELECT pg_create_logical_replication_slot('contratistas_slot', 'pgoutput');
debezium.slot.name=contratistas_slot

# Plugin de replicación
# "pgoutput" es nativo de PostgreSQL 10+ (no necesita instalación extra)
debezium.plugin.name=pgoutput

# Schemas a monitorear (separados por coma)
# Solo escuchará cambios en estos schemas
debezium.schema.include.list=contratistas,contratacion,ras

# Tablas a monitorear 
# Solo escuchará cambios en estas tablas
debezium.table.include.list=contratistas.ct_t_trazabilidad,contratistas.ct_t_informe_documento,contratacion.ct_t_supervision,contratacion.ct_pago,ras.ct_t_fondos

# Modo de snapshot
# "never" = No hacer snapshot inicial, solo cambios futuros
# "always" = Hacer snapshot de todos los datos al iniciar
# "initial" = Snapshot solo la primera vez
debezium.snapshot.mode=never

# Heartbeat: envía eventos periódicos para que PostgreSQL no acumule WAL
debezium.heartbeat.interval.ms=10000

# Debezium crea la publicación automáticamente solo con las tablas monitoreadas
debezium.publication.autocreate.mode=filtered

# Nombre del motor Debezium (para identificación en logs)
debezium.engine.name=contrato-cdc-engine

# Clase del conector PostgreSQL de Debezium
# No cambiar a menos que sepas lo que haces
debezium.connector.class=io.debezium.connector.postgresql.PostgresConnector

# Servidor Kafka (requerido por Debezium aunque no uses Kafka)
# El motor embebido de Debezium usa Kafka Connect internamente
debezium.bootstrap.servers=localhost:9092

# Archivo para guardar los offsets del CDC
# Permite que Debezium recuerde dónde se quedó al reiniciar
debezium.offset.storage.file.filename=C:/Users/Dev/Documents/Monica/cdc-offsets.dat

# ============================================
# LOGGING - Reducir ruido de Debezium/Kafka
# ============================================
logging.level.io.debezium=WARN
logging.level.org.apache.kafka=WARN
logging.level.io.debezium.connector.postgresql=WARN
