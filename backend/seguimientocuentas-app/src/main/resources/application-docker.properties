spring.application.name=seguimientocuentas
server.port=${SUPERVISA_SERVER_PORT:8080}
server.forward-headers-strategy=framework

# ============================================
# TOMCAT - capacidad de conexiones
# accept-count=100 (defecto) desbordaba en rafagas y perdia SYN, provocando
# retransmisiones TCP de 1/3/7 s con el CPU ocioso.
# max-keep-alive-requests=-1 deja el ciclo de vida del pool en manos de nginx;
# con el defecto (100) Tomcat cerraba conexiones que nginx seguia reutilizando.
# ============================================
server.tomcat.accept-count=1024
server.tomcat.max-connections=16384
server.tomcat.max-keep-alive-requests=-1

# ============================================
# POSTGRESQL - perfil Docker
# Los valores reales se inyectan por variables de entorno.
# ============================================
spring.datasource.url=${SUPERVISA_DB_URL:jdbc:postgresql://host.docker.internal:5432/supervisa}
spring.datasource.username=${SUPERVISA_DB_USER:postgres}
spring.datasource.password=${SUPERVISA_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================
# RESUMEN DE CONTRATOS
# La lista completa vive en memoria y la parchea el CDC; ventana para agrupar rafagas de eventos.
# ============================================
contratos.resumen.publicar-ms=1000

# ============================================
# KEYCLOAK - Login con doble factor (OIDC)
# auth.enabled=false devuelve al comportamiento anterior (API abierta sin token).
# ============================================
auth.enabled=${AUTH_ENABLED:true}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:}
keycloak.jwks-uri=${KEYCLOAK_JWKS_URI:}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:ge-cor}

# ============================================
# GECOR - base de usuarios, roles y permisos granulares
# Apagada (enabled=false) el acceso queda abierto para todos, como antes de existir GECOR.
# ============================================
gecor.enabled=${GECOR_ENABLED:false}
gecor.url=${GECOR_DB_URL:jdbc:postgresql://host.docker.internal:5432/gecor}
gecor.username=${GECOR_DB_USER:postgres}
gecor.password=${GECOR_DB_PASSWORD:postgres}
gecor.pool-size=${GECOR_DB_POOL:5}
gecor.ttl-sesion-segundos=60
# Crea la base si no existe y aplica las migraciones de db/migration/gecor al arrancar.
gecor.crear-base=${GECOR_CREAR_BASE:true}
# Bootstrap del administrador: correos y nombres (separados por coma) que reciben el
# rol ADMIN la primera vez que entran, siempre que todavia no tengan rol asignado.
gecor.admin-correos=${GECOR_ADMIN_CORREOS:fabio.santos@cundinamarca.gov.co}
gecor.admin-nombres=${GECOR_ADMIN_NOMBRES:FABIO ANDRES SANTOS SANABRIA}

# ============================================
# CDC - DEBEZIUM dentro del backend
# Requiere wal_level = logical en PostgreSQL
# ============================================
cdc.enabled=${SUPERVISA_CDC_ENABLED:true}

debezium.database.hostname=${SUPERVISA_CDC_HOST:host.docker.internal}
debezium.database.port=${SUPERVISA_CDC_PORT:5432}
debezium.database.user=${SUPERVISA_CDC_USER:postgres}
debezium.database.password=${SUPERVISA_CDC_PASSWORD:postgres}
debezium.database.dbname=${SUPERVISA_CDC_DB:supervisa}

debezium.topic.prefix=supervisa
debezium.slot.name=contratistas_slot
debezium.plugin.name=pgoutput
debezium.schema.include.list=contratistas,contratacion,ras,public
debezium.table.include.list=contratacion.ct_t_contrato_sap,contratistas.ct_t_trazabilidad,contratistas.ct_t_informe_actividades,contratacion.ct_t_supervision,contratistas.ct_p_estado,public.t_usuarios,contratistas.ct_t_informe_documento,ras.ct_t_fondos,contratacion.ct_pago

debezium.snapshot.mode=${SUPERVISA_CDC_SNAPSHOT_MODE:never}
debezium.heartbeat.interval.ms=10000
debezium.publication.autocreate.mode=filtered
debezium.engine.name=contrato-cdc-engine
debezium.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.bootstrap.servers=${SUPERVISA_CDC_BOOTSTRAP:localhost:9092}
debezium.offset.storage.file.filename=${SUPERVISA_CDC_OFFSETS_FILE:/app/data/cdc-offsets.dat}

logging.level.io.debezium=WARN
logging.level.org.apache.kafka=WARN
