map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sin pool, nginx abria una conexion nueva al backend por peticion y desbordaba
# el accept-count de Tomcat en las rafagas. El timeout va por debajo del idle de
# Tomcat para no reutilizar una conexion que el backend ya cerro.
upstream backend_api {
    server backend:8080;
    keepalive 256;
    keepalive_requests 10000;
    keepalive_timeout 15s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API REST del backend
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El resumen ya llega gzip desde el backend: comprimirlo aqui costaba 0,68 nucleos por usuario.
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        # El resumen pesa ~3 MB gzip: con el tampon temporal en disco cada respuesta grande
        # hacia un spool a /var/cache/nginx y salia mas lenta que el propio backend.
        proxy_max_temp_file_size 0;
    }

    # WebSocket CDC
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Assets con hash: cache agresivo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Config runtime de Keycloak: cambia con el entorno, nunca se cachea.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Intercambio de codigo por token (Authorization Code + PKCE).
    # El navegador no puede llamar al /token de Keycloak: ese endpoint exige un
    # Origin literal igual al "Web origins" del client y el navegador manda el
    # suyo. Se rutea por el mismo origen y nginx reenvia sin cabecera Origin
    # (peticion servidor-a-servidor). El bloque se genera en runtime en
    # /etc/nginx/oidc-proxy.conf (deploy/app-entrypoint.sh).
    include /etc/nginx/oidc-proxy.conf;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # SPA: cualquier ruta desconocida vuelve al index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
