# Placeholder: se sobreescribe en runtime por deploy/app-entrypoint.sh con el
# proxy real hacia el endpoint de token de Keycloak. Si esta copia llegara a
# usarse (contenedor sin entrypoint), el error es claro en vez de un 404.
location = /oidc/token {
    return 503 '{"error":"oidc_no_configurado","message":"Falta KEYCLOAK_ISSUER_URI en el entorno del frontend."}';
}
